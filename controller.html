<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>TXL Escort</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="controller-page">
    <div id="arena" class="hidden"></div>
    <div id="pad">
      <header>
        <div class="eyebrow">TXL Trader</div>
        <h1>Escort</h1>
        <p class="status">Scan the QR on the captain’s screen.</p>
        <div class="ship-chip hidden"><span class="swatch"></span> Your ship</div>
        <div class="meter hull-meter hidden">
          <label>HULL</label>
          <div class="bar hull"><span></span></div>
          <b class="hull-v"></b>
        </div>
        <p class="keys-hint hidden muted small">WASD / arrows move · Space fire</p>
      </header>
      <form class="join-form hidden">
        <div class="room-fields hidden">
          <label for="room">Room code</label>
          <input id="room" name="room" maxlength="5" spellcheck="false" autocomplete="off" />
        </div>
        <label for="callsign">Callsign</label>
        <input id="callsign" name="callsign" maxlength="16" autocomplete="nickname" />
        <label class="stick-opt">
          <input type="checkbox" id="stick-only" />
          Use the on-screen stick
        </label>
        <button class="btn primary" type="submit">Join</button>
      </form>
      <div class="controls hidden">
        <div class="stick" id="stick"><div class="knob"></div></div>
        <button type="button" class="fire" id="fire">FIRE</button>
      </div>
    </div>
    <script type="module" src="/src/controller.js"></script>
  </body>
</html>
